[net]
git-fetch-with-cli = true

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "link-arg=/STACK:8388608"]

[target.x86_64-pc-windows-gnu]
rustflags = ["-C", "link-arg=-Wl,--stack,8388608"]

[target.i686-pc-windows-msvc]
rustflags = ["-C", "link-arg=/STACK:8388608"]

# NOTE: celestia-island sibling-crate [patch] entries are machine-specific
# and are managed by `celestia-devtools register-patches` in the user-level
# ~/.cargo/config.toml. Do not add hardcoded local paths here.
