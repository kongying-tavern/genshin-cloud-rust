name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache Cargo (sources only)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-sources-${{ hashFiles('**/Cargo.toml') }}

      - name: Run unit tests
        run: cargo test --workspace --lib --no-fail-fast

      - name: Run integration tests
        run: cargo test --workspace --tests --no-fail-fast

  # DB-backed integration tests. Provisions a Postgres service and runs the
  # `user_db` test binary (and any future `*_db` binaries). Tests self-skip when
  # GCS_TEST_DB is unset, so this job is the only place that actually exercises
  # them. Mirrors tests/docker/docker-compose.e2e.yml credentials.
  integration:
    name: DB integration
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: genshin_map
          POSTGRES_PASSWORD: genshin_map
          POSTGRES_DB: genshin_map
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U genshin_map"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      GCS_TEST_DB: "1"
      DB_USERNAME: genshin_map
      DB_PASSWORD: genshin_map
      DB_DATABASE: genshin_map

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache Cargo (sources only)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ubuntu-cargo-sources-${{ hashFiles('**/Cargo.toml') }}

      - name: Run DB-backed tests
        run: cargo test -p genshin-cloud-tests --test user_db --test api_db --test res_db --no-fail-fast

  # Lints both the PR title (the squash-merge subject) and every commit in
  # the PR/push range, mirroring celestia-island/celestia-devtools'
  # commit-msg-lint.yml. Inlined onto a GitHub-hosted runner because the
  # reusable workflow targets the org's self-hosted runners, which are not
  # registered for this repository — every delegated run queued forever and
  # blocked all merges (required check).
  commit-msg:
    # Must match the branch-protection required context exactly (the
    # delegated reusable workflow reported as "Commit Message Lint /
    # Lint commit messages"; keeping the old name keeps protection green).
    name: Commit Message Lint / Lint commit messages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install celestia-devtools
        run: pip install git+https://github.com/celestia-island/celestia-devtools.git@master

      - name: Lint PR title (squash merge subject)
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -o pipefail
          [ -n "$(printf '%s' "$PR_TITLE" | tr -d '[:space:]')" ] || { echo "empty PR title"; exit 1; }
          echo "PR title: $PR_TITLE"
          printf '%s\n' "$PR_TITLE" | celestia-devtools commit-msg-lint check --stdin-subjects

      - name: Lint all commits in the PR
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        env:
          BASE_NAME: ${{ github.event.pull_request.base.ref }}
        run: |
          set -o pipefail
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          BASE_REF="$(git rev-parse --verify -q "origin/${BASE_NAME}" || echo "${{ github.event.pull_request.base.sha }}")"
          MERGE_BASE="$(git merge-base "$BASE_REF" "$HEAD_SHA" 2>/dev/null || echo "$BASE_REF")"
          RANGE="${MERGE_BASE}..${HEAD_SHA}"
          echo "Linting commits in range: $RANGE"
          git log --format='%s' "$RANGE" | celestia-devtools commit-msg-lint check --stdin-subjects

      - name: Lint all new commits on push
        if: github.event_name == 'push'
        run: |
          set -o pipefail
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.event.after }}"
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || [ -z "$BEFORE" ]; then
            RANGE="$AFTER"
          else
            RANGE="${BEFORE}..${AFTER}"
          fi
          echo "Linting commits in range: $RANGE"
          git log --format='%s' "$RANGE" | celestia-devtools commit-msg-lint check --stdin-subjects

  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Trufflehog Secrets Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: .
          extra_args: --only-verified
