name: Docker

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          # 发布目标为官方组织命名空间（kongying-tavern）：
          # - 官方仓库运行时，GITHUB_TOKEN 即可推送该命名空间；
          # - fork 上运行时，需配置 GHCR_USER/GHCR_PAT（write:packages）。
          username: ${{ secrets.GHCR_USER || github.actor }}
          password: ${{ secrets.GHCR_PAT || github.token }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          # 官方组织命名空间（无论 workflow 在 fork 还是官方仓库触发）
          images: ghcr.io/kongying-tavern/genshin-cloud-rust
          tags: |
            # 语义化版本 tag（v1.2.3 → 1.2.3 / 1.2 / 1）
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # master 分支：sha 短哈希（试部署/回滚用）
            type=sha,prefix=sha-,format=short
            # 发布（tag）或 master push 都更新 latest（试部署期以 latest 为准）
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
