name: Dockeron:  push:    branches: [master]    tags: ['v*']  pull_request:    branches: [master]  workflow_dispatch:concurrency:  group: docker-${{ github.ref }}  cancel-in-progress: truepermissions:  contents: read  packages: writejobs:  build:    name: Build image    runs-on: ubuntu-latest    steps:      - name: Checkout code        uses: actions/checkout@v4      - name: Set up Buildx        uses: docker/setup-buildx-action@v3      - name: Login to GHCR        if: github.event_name != 'pull_request'        uses: docker/login-action@v3        with:          registry: ghcr.io          # 鍙戝竷鐩爣涓哄畼鏂圭粍缁囧懡鍚嶇┖闂达紙kongying-tavern锛夛細          # - 瀹樻柟浠撳簱杩愯鏃讹紝GITHUB_TOKEN 鍗冲彲鎺ㄩ€佽鍛藉悕绌洪棿锛?          # - fork 涓婅繍琛屾椂锛岄渶閰嶇疆 GHCR_USER/GHCR_PAT锛坵rite:packages锛夈€?          username: ${{ secrets.GHCR_USER || github.actor }}          password: ${{ secrets.GHCR_PAT || github.token }}      - name: Extract image metadata        id: meta        uses: docker/metadata-action@v5        with:          # 瀹樻柟缁勭粐鍛藉悕绌洪棿锛堟棤璁?workflow 鍦?fork 杩樻槸瀹樻柟浠撳簱瑙﹀彂锛?          images: ghcr.io/kongying-tavern/genshin-cloud-rust          tags: |            # 璇箟鍖栫増鏈?tag锛坴1.2.3 鈫?1.2.3 / 1.2 / 1锛?            type=semver,pattern={{version}}            type=semver,pattern={{major}}.{{minor}}            # master 鍒嗘敮锛歴ha 鐭搱甯岋紙璇曢儴缃?鍥炴粴鐢級            type=sha,prefix=sha-,format=short            # 鍙戝竷锛坱ag锛夋垨 master push 閮芥洿鏂?latest锛堣瘯閮ㄧ讲鏈熶互 latest 涓哄噯锛?            type=raw,value=latest,enable=${{ github.event_name == 'push' }}      - name: Build and push image        uses: docker/build-push-action@v6        with:          context: .          file: ./Dockerfile          push: ${{ github.event_name != 'pull_request' }}          tags: ${{ steps.meta.outputs.tags }}          labels: ${{ steps.meta.outputs.labels }}          cache-from: type=gha          cache-to: type=gha,mode=max