name: Docker

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build image
    # 镜像构建与发布严格只属于官方仓库（kongying-tavern）：fork 上的
    # GITHUB_TOKEN 没有官方组织包的写权限，push 只会白跑并失败。因此
    # fork 上仅保留 PR 构建校验（分支保护的必需检查），master/tag push
    # 与手动触发一律跳过；镜像只从官方仓库发布。
    if: >-
      github.event_name == 'pull_request'
      || github.repository == 'kongying-tavern/genshin-cloud-rust'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          # 能走到这里的 push 只可能来自官方仓库，GITHUB_TOKEN 即可推送
          # 自己的组织命名空间，无需额外 PAT。
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          # 官方组织命名空间（发布只发生在官方仓库，见 job 级 if）
          images: ghcr.io/kongying-tavern/genshin-cloud-rust
          tags: |
            # 语义化版本 tag（v1.2.3 → 1.2.3 / 1.2 / 1）
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # master 分支：sha 短哈希（试部署/回滚用）
            type=sha,prefix=sha-,format=short
            # 发布（tag）或 master push 都更新 latest（试部署期以 latest 为准）
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
