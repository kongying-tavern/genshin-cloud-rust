name: Bench

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: true

jobs:
  # Informational only — NOT in the branch-protection required contexts (same
  # tier as Coverage / Hygiene). Runs the criterion benchmarks; the numbers are
  # for regressions eyeballing, not gating. The Postgres service enables the
  # DB-backed group (GCS_TEST_DB self-skip mirrors the *_db integration
  # tests); quick-mode flags keep the run fast — use `just bench` locally for
  # full runs with baseline comparisons under target/criterion.
  bench:
    name: Bench
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: genshin_map
          POSTGRES_PASSWORD: genshin_map
          POSTGRES_DB: genshin_map
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U genshin_map"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      GCS_TEST_DB: "1"
      DB_USERNAME: genshin_map
      DB_PASSWORD: genshin_map
      DB_DATABASE: genshin_map

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Cache Cargo (sources only)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ubuntu-cargo-sources-${{ hashFiles('**/Cargo.toml') }}

      - name: Run criterion benches
        run: cargo bench --workspace -- --warm-up-time 1 --measurement-time 2 --sample-size 10

      - name: Upload criterion reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: criterion-reports
          path: target/criterion
          if-no-files-found: ignore
