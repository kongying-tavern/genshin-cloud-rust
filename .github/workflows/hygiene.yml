name: Hygiene

# Static checks for the repo's own plumbing: workflow syntax (actionlint) and
# shell scripts (shellcheck), so CI config and deploy scripts cannot rot
# silently. Non-blocking (not in the branch-protection required contexts).

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: hygiene-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install actionlint
        run: |
          set -euo pipefail
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint --version

      - name: Run actionlint
        run: ./actionlint -color

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # shellcheck is preinstalled on ubuntu-latest runners.
      - name: Run shellcheck on all shell scripts
        run: |
          set -euo pipefail
          mapfile -t scripts < <(find . -type f -name '*.sh' -not -path './target/*' -not -path './node_modules/*')
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "No shell scripts found."
            exit 0
          fi
          printf 'Checking:\n%s\n' "${scripts[@]}"
          shellcheck "${scripts[@]}"

  # Drift gate for the staged celestia-devtools recipes: the .just/ staging
  # model only works while the repo's justfile stays compatible with the
  # shared template. Non-blocking companion to actionlint/shellcheck.
  just-drift:
    name: justfile drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'

      - name: Install just
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with:
          tool: just

      - name: Install celestia-devtools
        run: pip install git+https://github.com/celestia-island/celestia-devtools.git

      - name: Stage and check drift
        run: |
          set -euo pipefail
          just fetch
          celestia-devtools init --check
