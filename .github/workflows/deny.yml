name: Cargo Deny

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Weekly sweep so newly disclosed RUSTSEC advisories / license problems are
  # caught even when nothing changed in the repo (mirrors the org security.yml).
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: deny-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
