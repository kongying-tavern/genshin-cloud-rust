# 绌鸿崸閰掗鍚庣绾夸笂閮ㄧ讲缂栨帓锛堣瘯閮ㄧ讲鐢級## 鐢ㄦ硶锛?#   cp .env.example .env        # 鎸夐渶淇敼锛圖B/REDIS/MINIO/JWT_SECRET锛?#   ./deploy.sh## 闀滃儚锛歡hcr.io/kongying-tavern/genshin-cloud-rust锛坢aster push 鑷姩鏋勫缓 latest + sha-*锛?# 鍥炴粴鎸囧畾鐗堟湰锛欼MAGE_TAG=sha-abc123 docker compose up -dservices:  gcs-backend:    image: ghcr.io/kongying-tavern/genshin-cloud-rust:${IMAGE_TAG:-latest}    container_name: gcs-backend    restart: unless-stopped    env_file:      - .env    environment:      # 瀹瑰櫒鍐呯洃鍚?80锛坢ain.rs 榛樿 PORT=80锛夛紱瀹夸富鏈虹鍙ｇ敱 .env 鐨?HOST_PORT 鎺у埗      PORT: "80"      # Redis 璧?compose 鍐呯綉锛堟湇鍔″悕 gcs-redis锛?      REDIS_HOST: gcs-redis      REDIS_PORT: "6379"    ports:      - "${HOST_PORT:-8101}:80"    depends_on:      gcs-redis:        condition: service_healthy    healthcheck:      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/.well-known/jwks.json"]      interval: 30s      timeout: 5s      retries: 3      start_period: 10s    logging:      driver: json-file      options:        max-size: "20m"        max-file: "5"  # 浼氳瘽/闄愭祦 Redis锛堝悗绔?Redis 涓嶅彲鐢ㄦ椂浼氶檷绾э紝浣嗙嚎涓婂簲淇濇寔鍙敤锛?  gcs-redis:    image: redis:7-alpine    container_name: gcs-redis    restart: unless-stopped    command: ["redis-server", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]    # 浠呬緵鏈満杩愮淮妫€鏌ワ紝涓嶆毚闇插叕缃?    ports:      - "127.0.0.1:16379:6379"    healthcheck:      test: ["CMD", "redis-cli", "ping"]      interval: 10s      timeout: 3s      retries: 5    volumes:      - gcs-redis-data:/datavolumes:  gcs-redis-data: