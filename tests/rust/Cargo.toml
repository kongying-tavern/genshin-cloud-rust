[package]
name = "genshin-cloud-tests"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
# Workspace crates under test
_utils = { path = "../../packages/utils" }
_database = { path = "../../packages/database" }
_functions = { path = "../../packages/functions" }
_router = { path = "../../packages/router" }

# sea-orm traits (EntityName, Iterable) for compile-time entity assertions;
# Schema + ConnectionTrait for DB-backed tests to create tables on the fly.
sea-orm = { workspace = true }

# Test runtime
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
md5 = { workspace = true }
minio = { workspace = true }
jsonwebtoken = { workspace = true }
uuid = { workspace = true }
redis = { workspace = true }
flate2 = { workspace = true }

[dev-dependencies]
tokio-test = "^0.4"
regex-lite = "^0.1"
base64 = { workspace = true }
rsa = { version = "^0.9", features = ["pem"] }
rand_core = { version = "0.6", features = ["getrandom"] }
# ServiceExt::oneshot — drives the assembled Router in http_layer without a
# real listener (same 0.5 line the workspace already locks via axum).
tower = { version = "^0.5", features = ["util"] }
# Request/Response/StatusCode building blocks for the http_layer oneshot test.
axum = { workspace = true }
# Same ring-only rustls line the workspace pins: the test binary must install
# the process-level CryptoProvider that main.rs normally installs, because
# router() builds reqwest clients (CDN proxy) at assembly time.
rustls = { workspace = true }

[[test]]
name = "utils_smoke"
path = "tests/utils_smoke.rs"

[[test]]
name = "area_domain"
path = "tests/area/area_domain_test.rs"

[[test]]
name = "marker_domain"
path = "tests/marker/marker_domain_test.rs"

[[test]]
name = "schema"
path = "tests/schema_test.rs"

# DB-backed integration test. Gated on the GCS_TEST_DB env var (set by the CI
# `integration` job, which provisions Postgres and Redis services). Skips
# cleanly when no database is available, so `cargo test --workspace` stays
# green everywhere else.
[[test]]
name = "user_db"
path = "tests/user_db_test.rs"

# DB-backed API business-assertion test. Same GCS_TEST_DB gate as user_db;
# seeds area + item rows and asserts the business-layer functions return real
# data (not just 401/403 smoke checks). Covers area list/add and the
# BinaryMD5 item_doc pipeline.
[[test]]
name = "api_db"
path = "tests/api_db_test.rs"

# MinIO-backed res-upload test. Same GCS_TEST_DB gate plus a reachable MinIO
# instance (MINIO_ACCESS_KEY / MINIO_SECRET_KEY set). Skips when either is
# missing — CI provisions Postgres and Redis but no MinIO service, so this
# stays green there while the *_db tests below run for real.
[[test]]
name = "res_db"
path = "tests/res_db_test.rs"

# JWKS key-rotation unit test. No DB; sets JWT_* env vars before touching the
# lazy key material (own process, same pattern as api_db).
[[test]]
name = "jwks_rotation"
path = "tests/jwks_rotation_test.rs"

# Wire-format compatibility unit tests. No DB: inline sample constants copied
# from the real-database audit (db_audit.md) verify ser/de against the
# production data shapes (access_policy prefixes, history content snapshots,
# marker position strings, notice channel arrays, link_action enums, bcrypt
# password prefix). One ignored test documents the P1 unprefixed
# access_policy gap (rows id=194/195).
[[test]]
name = "wire_format"
path = "tests/wire_format_test.rs"

# Redis second-level BinaryMD5 cache test. Same GCS_TEST_DB gate plus a
# reachable Redis (backend's redis_conn must be Some). Skips when either is
# missing; CI's `integration` job provisions Postgres + Redis, so it runs
# there.
[[test]]
name = "redis_cache_db"
path = "tests/redis_cache_db_test.rs"

# HTTP-layer oneshot test — the first router-level test. Drives the Router
# assembled by `_router::routes::router()` directly via
# `tower::ServiceExt::oneshot`: no port, no DB. Covers route mounting, the
# auth middleware chain, the JWKS public endpoint (+ #135 security headers),
# the 16 MiB body limit, the unconfigured-CORS path, the #134 WS handshake
# auth contract, and the fallback status.
[[test]]
name = "http_layer"
path = "tests/http_layer_test.rs"
