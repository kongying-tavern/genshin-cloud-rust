[package]
authors = ["langyo <langyo.china@gmail.com>"]
edition = "2024"
name = "_router"
publish = false
version.workspace = true

# Keep `cargo bench --workspace` on the real [[bench]] targets: bin targets
# default to bench = true and would run the server / init binaries under
# cargo bench (rejecting criterion CLI flags).
[[bin]]
name = "_router"
bench = false

[[bin]]
name = "init_db"
path = "src/bin/init_db.rs"
bench = false

# The lib target exists so the integration tests (`tests/rust`) can drive the
# assembled Router directly; keep it out of `cargo bench` targets like the
# bins above.
[lib]
bench = false

[dependencies]
_database = { path = "../database", version = "*" }
_functions = { path = "../functions", version = "*" }
_utils = { path = "../utils", version = "*" }

anyhow = { workspace = true }
async-trait = { workspace = true }
once_cell = { workspace = true }
tokio = { workspace = true }

base64 = { workspace = true }
chrono = { workspace = true }


serde = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }
uuid = { workspace = true }

bcrypt = { workspace = true }
jsonwebtoken = { workspace = true }

env_logger = { workspace = true }
log = { workspace = true }
tracing = { workspace = true }

axum = { workspace = true }
axum-extra = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
urlencoding = "2"
tower-http = { workspace = true }
md5 = { workspace = true }
bzip2 = { workspace = true }
sea-orm = { workspace = true }
